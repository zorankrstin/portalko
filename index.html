      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var spaRoute = params.get('spa_route');
          if (spaRoute) {
            window.history.replaceState(null, '', decodeURIComponent(spaRoute) + window.location.hash);
          }

        // Firefox Gecko guard: Prevent NS_ERROR_UNEXPECTED when third-party ad scripts (e.g. iPROM, AdSense)
        // call getBoundingClientRect / getComputedStyle on hidden, detached or cross-origin iframe elements

          var origGetBoundingClientRect = Element.prototype.getBoundingClientRect;
          Element.prototype.getBoundingClientRect = function() {
            try {
              return origGetBoundingClientRect.apply(this, arguments);
            } catch (e) {
              if (typeof DOMRect !== 'undefined') {
                try { return new DOMRect(0, 0, 0, 0); } catch (_) {}
              }
              return { top: 0, bottom: 0, left: 0, right: 0, width: 0, height: 0, x: 0, y: 0, toJSON: function() { return this; } };
            }
          };
        }

        if (typeof window !== 'undefined' && window.getComputedStyle) {
          var origGetComputedStyle = window.getComputedStyle;
          window.getComputedStyle = function(el, pseudo) {
            try {
              return origGetComputedStyle.apply(this, arguments);
            } catch (e) {
              return (el && el.style) ? el.style : {};
            }
          };
        }

        // Suppress benign third-party analytics / ads / HMR / Vite / iframe errors
        var suppressPatterns = [
          'WebSocket',
          '@vite/client',
          'createWebSocketModuleRunnerTransport',
          'insertBefore',
          'parentNode',
          'adsbygoogle',
          'property "insertBefore"',
          'property \'insertBefore\'',
          'NS_ERROR_UNEXPECTED',
          'iprom',
          'ipromcloud',
          'cdn.iprom.net',
          'Utils.js',
          'isVisible',
          'TimeInView'
        ];

        function shouldSuppress(val) {
          if (!val) return false;
          var str = String(val);
          for (var i = 0; i < suppressPatterns.length; i++) {
            if (str.indexOf(suppressPatterns[i]) !== -1) return true;
          }
          return false;
        }

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && (event.error.message || event.error.name))) || '';
          var src = event && event.filename ? event.filename : '';
          var stack = event && event.error && event.error.stack ? String(event.error.stack) : '';
          if (shouldSuppress(msg) || shouldSuppress(src) || shouldSuppress(stack)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason ? (event.reason.message || String(event.reason)) : '';
          var reasonStack = event && event.reason && event.reason.stack ? String(event.reason.stack) : '';
          if (shouldSuppress(reason) || shouldSuppress(reasonStack)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var errMsg = msg || '';
          var errSrc = url || '';
          var errStack = error && error.stack ? String(error.stack) : '';
          if (shouldSuppress(errMsg) || shouldSuppress(errSrc) || shouldSuppress(errStack) || shouldSuppress(error && error.message)) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
        };
      })();
