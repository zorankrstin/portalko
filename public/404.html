<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Stran ni bila najdena | Portalko</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      .card {
        background: #ffffff;
        padding: 2.75rem 2rem;
        border-radius: 1rem;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
        max-width: 460px;
        width: 100%;
        text-align: center;
        border: 1px solid #e2e8f0;
      }
      .badge {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.35rem 0.75rem;
        border-radius: 9999px;
        background: #fee2e2;
        color: #dc2626;
        margin-bottom: 1.25rem;
      }
      .code {
        font-size: 4rem;
        font-weight: 900;
        color: #0f172a;
        line-height: 1;
        margin: 0 0 0.75rem;
        letter-spacing: -0.04em;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.75rem;
        color: #1e293b;
      }
      p {
        color: #64748b;
        font-size: 0.95rem;
        line-height: 1.55;
        margin: 0 0 1.75rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.95rem;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      a.btn:hover {
        background: #1d4ed8;
      }
      a.btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Napaka 404</div>
      <div class="code">404</div>
      <h1>Stran ne obstaja</h1>
      <p>Iskana vsebina ne obstaja, je bila odstranjena ali pa je bil vnesen napačen spletni naslov.</p>
      <a class="btn" href="/">Nazaj na vstopno stran</a>
    </div>
  </body>
</html>
